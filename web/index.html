<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Accurate prayer times, Qibla direction, Quran reader, and masjid finder for Muslims.">
  <meta name="theme-color" content="#1B4332">

  <!-- iOS / Safari PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Athan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Athan - Call to Success</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* PWA install banner */
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: #1B4332;
      color: #fff;
      padding: 14px 20px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.4);
      font-family: sans-serif;
      font-size: 15px;
    }
    #pwa-install-banner.visible { display: flex; }
    #pwa-install-banner .banner-icon { font-size: 28px; flex-shrink: 0; }
    #pwa-install-banner .banner-text { flex: 1; line-height: 1.3; }
    #pwa-install-banner .banner-text strong { display: block; font-size: 16px; }
    #pwa-install-banner .banner-text span { opacity: 0.8; font-size: 13px; }
    #pwa-install-btn {
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #pwa-dismiss-btn {
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <!-- PWA install banner (shown automatically when browser fires beforeinstallprompt) -->
  <div id="pwa-install-banner" role="complementary" aria-label="Install Athan app">
    <div class="banner-icon">🕌</div>
    <div class="banner-text">
      <strong>Install Athan</strong>
      <span>Add to your home screen for the full app experience</span>
    </div>
    <button id="pwa-install-btn">Install</button>
    <button id="pwa-dismiss-btn" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    // Capture the install prompt event and show the banner.
    let _deferredPrompt = null;
    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const dismissBtn = document.getElementById('pwa-dismiss-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _deferredPrompt = e;
      banner.classList.add('visible');
    });

    installBtn.addEventListener('click', async () => {
      if (!_deferredPrompt) return;
      _deferredPrompt.prompt();
      const { outcome } = await _deferredPrompt.userChoice;
      _deferredPrompt = null;
      banner.classList.remove('visible');
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('visible');
    });

    // Hide banner once installed.
    window.addEventListener('appinstalled', () => {
      banner.classList.remove('visible');
      _deferredPrompt = null;
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
