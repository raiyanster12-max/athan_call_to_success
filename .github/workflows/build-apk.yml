name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Keep Gradle JVM heap within GitHub-hosted runner limits (7 GB total RAM).
          GRADLE_OPTS: >-
            -Xmx4g
            -XX:MaxMetaspaceSize=512m
            -XX:ReservedCodeCacheSize=512m
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Building release APK with Google Maps API key..."
            flutter build apk --release
          else
            echo "GOOGLE_MAPS_API_KEY secret not set — building debug APK instead."
            echo "To build a release APK, add GOOGLE_MAPS_API_KEY as a repository secret."
            flutter build apk --debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athan-apk
          # flutter build apk places the output here for both debug and release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
