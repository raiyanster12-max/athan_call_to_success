name: athan_call_to_success
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  hijri_date: ^1.1.0
  permission_handler: ^12.0.1
  http: ^1.2.0
  google_maps_flutter: ^2.7.0
  url_launcher: ^6.2.4
  # flutter_car_app: ^0.0.1 # Or similar Car App Library wrapper
  adhan: ^2.0.0+1
  imad_flutter: ^0.1.0 # Only used for Android Auto Quran audio
  # Ensure your prayer time and location packages are updated
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  quran: ^1.4.1
  quran_library: ^3.2.0
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  file_picker: ^10.3.10
  audioplayers: ^6.0.0
  audioplayers_platform_interface: ^7.1.1
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  shared_preferences: ^2.3.2
  android_alarm_manager_plus: ^5.0.0
  google_sign_in: ^6.2.2
  googlecast:
    path: third_party/googlecast

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4  
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/athan_app_icon.png"
    background_color: "#00796B"
    theme_color: "#00796B"
  windows:
    generate: true
    image_path: "assets/icon/athan_app_icon.png"
  # Using a relative path is safer for Flutter projects
  image_path: "assets/icon/athan_app_icon.png"
  adaptive_icon_background: "#00796B"
flutter:
  uses-material-design: true

  # This section is REQUIRED for the image to show up in your Dart code
  assets:
    - assets/icon/athan_app_icon.png
    - assets/audio/athan_beep.wav
    - assets/audio/Fajr Athan by Mishary Rashid.mp3
    - assets/audio/Athan by Mishary Rashid.mp3
    - assets/audio/Athan by Wakilur R Chowdhury.mp3
    - assets/images/